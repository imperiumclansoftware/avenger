framework:
    rate_limiter:
        # Tickets opened without an account, per IP address
        ticket_submission:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Installation code: cannot be found by trying
        setup_code:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            ticket_submission:
                policy: no_limit
            setup_code:
                policy: no_limit
